# Непрерывная интеграция: линтеры -> тесты с покрытием -> сборка артефакта.
# Запускается при каждом push и при каждом pull request в main/develop.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    name: lint
    runs-on: windows-latest   # WPF собирается только под Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Восстановление зависимостей
        run: dotnet restore

      - name: Проверка форматирования (whitespace)
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Проверка стиля кода (правила .editorconfig)
        run: dotnet format style --verify-no-changes --no-restore --severity warn

      - name: Сборка с анализаторами (Roslyn + StyleCop)
        shell: bash
        run: dotnet build --no-restore -c Release -clp:NoSummary 2>&1 | tee build.log

      - name: Сводка предупреждений анализаторов
        if: always()
        shell: bash
        run: |
          count=$( (grep -oE '[^ ]+\([0-9]+,[0-9]+\): warning [A-Z]+[0-9]+' build.log 2>/dev/null || true) | sort -u | wc -l)
          echo "### Предупреждения анализаторов: $count" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Модульные и интеграционные тесты с покрытием
        run: dotnet test -c Release --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Отчёт о покрытии кода
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub

      - name: Покрытие в сводке запуска
        if: always()
        shell: bash
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Сохранение результатов тестов и отчёта о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coveragereport

  build:
    name: build
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Публикация приложения
        run: dotnet publish src/ParkingManager/ParkingManager.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: ParkingManager-${{ github.sha }}
          path: publish
