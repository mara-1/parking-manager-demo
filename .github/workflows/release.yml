# Создание релиза при появлении тега версии vX.Y.Z на ветке main.
# Замеряет метрики, собирает приложение и публикует GitHub Release.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  metrics:
    uses: ./.github/workflows/metrics.yml

  release:
    name: release
    needs: metrics
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Версия из тега
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Тесты
        run: dotnet test -c Release

      - name: Публикация приложения
        run: dotnet publish src/ParkingManager/ParkingManager.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ env.VERSION }} -o publish

      - name: Архив сборки
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "ParkingManager-${{ github.ref_name }}.zip"

      - uses: actions/download-artifact@v4
        with:
          name: metrics
          path: metrics

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          name: ParkingManager ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            ParkingManager-${{ github.ref_name }}.zip
            metrics/metrics.md
            metrics/metrics.json
